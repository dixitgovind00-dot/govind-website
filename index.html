<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Govind Kumar Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
color:white;
overflow-x:hidden;
}

header{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.profile{
animation:fadeUp 1.5s ease;
}

.profile img{
width:180px;
height:180px;
border-radius:50%;
border:5px solid #00f7ff;
box-shadow:0 0 30px #00f7ff;
object-fit:cover;
transition:.4s;
}

.profile img:hover{
transform:scale(1.08);
}

h1{
font-size:42px;
margin-top:20px;
}

#typing{
font-size:22px;
color:#00f7ff;
margin-top:10px;
min-height:30px;
}

.buttons{
margin-top:30px;
}

.btn{
display:inline-block;
padding:14px 30px;
margin:10px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
background:#00f7ff;
color:#000;
transition:.3s;
}

.btn:hover{
transform:translateY(-5px);
box-shadow:0 0 20px #00f7ff;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(60px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<header>

<div class="profile">

<img src="profile.jpg" alt="Profile">

<h1>Govind Kumar</h1>
<section style="padding:80px 20px;text-align:center;">
<h2 style="font-size:36px;color:#00f7ff;">About Me</h2>

<p style="max-width:700px;margin:20px auto;font-size:18px;line-height:1.8;color:#ddd;">
Hello! I'm <b>Govind Kumar</b>.
I love Web Development, Technology and Content Creation.
Welcome to my personal portfolio website.
</p>

<h2 style="margin-top:60px;color:#00f7ff;">My Skills</h2>

<div style="margin-top:30px;display:flex;justify-content:center;gap:15px;flex-wrap:wrap;">

<span class="btn">HTML</span>
<span class="btn">CSS</span>
<span class="btn">JavaScript</span>
<span class="btn">GitHub</span>

</div>

</section>

<footer style="padding:30px;text-align:center;color:#aaa;">
© 2026 Govind Kumar | Made with ❤️
</footer>

<script>

const words=[
"Web Developer",
"Content Creator",
"Tech Enthusiast",
"Frontend Designer"
];

let i=0;
let j=0;
let current="";
let isDeleting=false;

function type(){

current=words[i];

if(isDeleting){
j--;
}else{
j++;
}

document.getElementById("typing").textContent=current.substring(0,j);

if(!isDeleting && j==current.length){
isDeleting=true;
setTimeout(type,1200);
return;
}

if(isDeleting && j==0){
isDeleting=false;
i=(i+1)%words.length;
}

setTimeout(type,isDeleting?60:120);

}

type();

</script>

</body>
</html>
  
<p id="typing"></p>

<div class="buttons">

<a class="btn" href="https://github.com/dixitgovind00-dot">GitHub</a>

<a class="btn" href="https://instagram.com/auraiya__up79">Instagram</a>

</div>

</div>
<a href="https://wa.me/919520225209" class="hire-btn">
  Hire Me
</a>
</header>
<script>
  window.addEventListener("load", () => {
    document.body.style.opacity = "1";
  });

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    card.addEventListener("mouseenter", () => {
      card.style.transform = "translateY(-10px)";
    });
    card.addEventListener("mouseleave", () => {
      card.style.transform = "translateY(0)";
    });
  });

</script>
</body>
</html>
