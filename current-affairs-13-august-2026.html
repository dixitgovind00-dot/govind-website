let current = 0;
let score = 0;
let answered = false;
let userAnswers = new Array(questions.length).fill(null);


function loadQuestion(){

    answered = userAnswers[current] !== null;

    const q = questions[current];

    document.getElementById("progress").innerText =
        `Question ${current + 1} of ${questions.length}`;

    document.getElementById("question").innerHTML =
        q.q + "<span>" + q.h + "</span>";

    const optionsBox = document.getElementById("options");
    optionsBox.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn = document.createElement("button");

        btn.className = "option";
        btn.innerText = option;

        btn.onclick = () => selectAnswer(index);

        if(answered){

            btn.disabled = true;

            if(index === q.answer){
                btn.classList.add("correct");
            }

            if(index === userAnswers[current] &&
               index !== q.answer){
                btn.classList.add("wrong");
            }
        }

        optionsBox.appendChild(btn);
    });

    const explanation =
        document.getElementById("explanation");

    if(answered){

        explanation.style.display = "block";

        if(userAnswers[current] === q.answer){
            explanation.innerText = "✅ सही उत्तर!";
        }else{
            explanation.innerText =
                "❌ गलत उत्तर! सही उत्तर: " +
                q.options[q.answer];
        }

    }else{

        explanation.style.display = "none";
    }

    document.getElementById("prevBtn").disabled =
        current === 0;

    document.getElementById("nextBtn").innerText =
        current === questions.length - 1
        ? "Finish ✓"
        : "Next →";
}


function selectAnswer(index){

    if(answered) return;

    answered = true;

    userAnswers[current] = index;

    if(index === questions[current].answer){
        score++;
    }

    loadQuestion();
}


function nextQuestion(){

    if(current < questions.length - 1){

        current++;
        loadQuestion();

    }else{

        showResult();
    }
}


function previousQuestion(){

    if(current > 0){

        current--;
        loadQuestion();
    }
}


function showResult(){

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("score").innerText =
        score + " / " + questions.length;

    let percentage =
        (score / questions.length) * 100;

    let message = "";

    if(percentage >= 80){
        message = "🔥 शानदार! आपकी तैयारी बहुत अच्छी है।";
    }
    else if(percentage >= 60){
        message = "👍 बहुत अच्छा! थोड़ी और तैयारी करें।";
    }
    else if(percentage >= 40){
        message = "📚 अच्छा प्रयास! Current Affairs को दोबारा पढ़ें।";
    }
    else{
        message = "💪 मेहनत जारी रखें, अगली बार बेहतर स्कोर आएगा।";
    }

    document.getElementById("message").innerText =
        message;
}


function restartQuiz(){

    current = 0;
    score = 0;
    answered = false;

    userAnswers =
        new Array(questions.length).fill(null);

    document.getElementById("quiz").style.display = "block";

    document.getElementById("result").style.display = "none";

    loadQuestion();
}
